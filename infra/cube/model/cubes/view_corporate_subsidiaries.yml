cubes:
- name: ViewCorporateSubsidiaries
  sql: SELECT * FROM view_corporate_subsidiaries
  measures:
  - name: count
    type: count
  - name: total_ownership_percentage
    type: sum
    sql: ownership_percentage
  - name: avg_ownership_percentage
    type: avg
    sql: ownership_percentage
  dimensions:
  - name: id
    type: string
    sql: id
    primary_key: true
  - name: tenant_id
    type: string
    sql: tenant_id
  - name: sys_document_id
    type: string
    sql: sys_document_id
  - name: entity_name
    type: string
    sql: entity_name
  - name: parent_entity_name
    type: string
    sql: parent_entity_name
  - name: jurisdiction
    type: string
    sql: jurisdiction
  - name: ownership_percentage
    type: number
    sql: ownership_percentage
  - name: relationship_type
    type: string
    sql: relationship_type
  - name: additional_metadata
    type: string
    sql: CAST(additional_metadata AS TEXT)
