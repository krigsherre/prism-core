cubes:
- name: ViewMedicalRecords
  sql: SELECT * FROM view_medical_records
  measures:
  - name: count
    type: count
  - name: total_height
    type: sum
    sql: height
  - name: avg_height
    type: avg
    sql: height
  - name: total_weight
    type: sum
    sql: weight
  - name: avg_weight
    type: avg
    sql: weight
  - name: total_heart_rate
    type: sum
    sql: heart_rate
  - name: avg_heart_rate
    type: avg
    sql: heart_rate
  - name: total_temperature
    type: sum
    sql: temperature
  - name: avg_temperature
    type: avg
    sql: temperature
  dimensions:
  - name: id
    type: string
    sql: id
    primary_key: true
  - name: tenant_id
    type: string
    sql: tenant_id
  - name: sys_document_id
    type: string
    sql: sys_document_id
  - name: patient_id
    type: string
    sql: patient_id
  - name: patient_name
    type: string
    sql: patient_name
  - name: date_of_birth
    type: time
    sql: date_of_birth
  - name: gender
    type: string
    sql: gender
  - name: blood_type
    type: string
    sql: blood_type
  - name: provider_name
    type: string
    sql: provider_name
  - name: provider_id
    type: string
    sql: provider_id
  - name: facility_name
    type: string
    sql: facility_name
  - name: facility_address
    type: string
    sql: facility_address
  - name: visit_date
    type: time
    sql: visit_date
  - name: admission_date
    type: time
    sql: admission_date
  - name: discharge_date
    type: time
    sql: discharge_date
  - name: chief_complaint
    type: string
    sql: chief_complaint
  - name: attending_physician
    type: string
    sql: attending_physician
  - name: height
    type: number
    sql: height
  - name: weight
    type: number
    sql: weight
  - name: blood_pressure
    type: string
    sql: blood_pressure
  - name: heart_rate
    type: number
    sql: heart_rate
  - name: temperature
    type: number
    sql: temperature
  - name: additional_metadata
    type: string
    sql: CAST(additional_metadata AS TEXT)
