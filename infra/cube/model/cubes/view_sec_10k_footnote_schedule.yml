    type: string
    sql: sys_document_id
  - name: schedule_title
    type: string
    sql: schedule_title
  - name: segment_or_category_name
    type: string
    sql: segment_or_category_name
  - name: metric_name
    type: string
    sql: metric_name
  - name: amount
    type: number
    sql: amount
  - name: currency
    type: string
    sql: currency
  - name: period
    type: string
    sql: period
  - name: additional_metadata
    type: string
    sql: CAST(additional_metadata AS TEXT)
