cubes:
- name: ViewUtilityBills
  sql: SELECT * FROM view_utility_bills
  measures:
  - name: count
    type: count
  - name: total_previous_balance
    type: sum
    sql: previous_balance
  - name: avg_previous_balance
    type: avg
    sql: previous_balance
  - name: total_payments_received
    type: sum
    sql: payments_received
  - name: avg_payments_received
    type: avg
    sql: payments_received
  - name: total_new_charges
    type: sum
    sql: new_charges
  - name: avg_new_charges
    type: avg
    sql: new_charges
  - name: total_total_amount_due
    type: sum
    sql: total_amount_due
  - name: avg_total_amount_due
    type: avg
    sql: total_amount_due
  - name: total_usage_amount
    type: sum
    sql: usage_amount
  - name: avg_usage_amount
    type: avg
    sql: usage_amount
  dimensions:
  - name: id
    type: string
    sql: id
    primary_key: true
  - name: tenant_id
    type: string
    sql: tenant_id
  - name: sys_document_id
    type: string
    sql: sys_document_id
  - name: account_number
    type: string
    sql: account_number
  - name: invoice_number
    type: string
    sql: invoice_number
  - name: provider_name
    type: string
    sql: provider_name
  - name: provider_address
    type: string
    sql: provider_address
  - name: customer_name
    type: string
    sql: customer_name
  - name: service_address
    type: string
    sql: service_address
  - name: billing_address
    type: string
    sql: billing_address
  - name: billing_period_start
    type: time
    sql: billing_period_start
  - name: billing_period_end
    type: time
    sql: billing_period_end
  - name: due_date
    type: time
    sql: due_date
  - name: statement_date
    type: time
    sql: statement_date
  - name: previous_balance
    type: number
    sql: previous_balance
  - name: payments_received
    type: number
    sql: payments_received
  - name: new_charges
    type: number
    sql: new_charges
  - name: total_amount_due
    type: number
    sql: total_amount_due
  - name: usage_amount
    type: number
    sql: usage_amount
  - name: unit_of_measure
    type: string
    sql: unit_of_measure
  - name: utility_type
    type: string
    sql: utility_type
  - name: additional_metadata
    type: string
    sql: CAST(additional_metadata AS TEXT)
