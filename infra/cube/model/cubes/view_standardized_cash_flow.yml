cubes:
- name: ViewStandardizedCashFlow
  sql: SELECT * FROM view_standardized_cash_flow
  measures:
  - name: count
    type: count
  - name: total_net_cash_from_operating_activities
    type: sum
    sql: net_cash_from_operating_activities
  - name: avg_net_cash_from_operating_activities
    type: avg
    sql: net_cash_from_operating_activities
  - name: total_capital_expenditure
    type: sum
    sql: capital_expenditure
  - name: avg_capital_expenditure
    type: avg
    sql: capital_expenditure
  - name: total_net_cash_from_investing_activities
    type: sum
    sql: net_cash_from_investing_activities
  - name: avg_net_cash_from_investing_activities
    type: avg
    sql: net_cash_from_investing_activities
  - name: total_dividends_paid
    type: sum
    sql: dividends_paid
  - name: avg_dividends_paid
    type: avg
    sql: dividends_paid
  - name: total_debt_issued_or_repaid
    type: sum
    sql: debt_issued_or_repaid
  - name: avg_debt_issued_or_repaid
    type: avg
    sql: debt_issued_or_repaid
  - name: total_net_cash_from_financing_activities
    type: sum
    sql: net_cash_from_financing_activities
  - name: avg_net_cash_from_financing_activities
    type: avg
    sql: net_cash_from_financing_activities
  - name: total_net_change_in_cash
    type: sum
    sql: net_change_in_cash
  - name: avg_net_change_in_cash
    type: avg
    sql: net_change_in_cash
  dimensions:
  - name: id
    type: string
    sql: id
    primary_key: true
  - name: tenant_id
    type: string
    sql: tenant_id
  - name: sys_document_id
    type: string
    sql: sys_document_id
  - name: net_cash_from_operating_activities
    type: number
    sql: net_cash_from_operating_activities
  - name: capital_expenditure
    type: number
    sql: capital_expenditure
  - name: net_cash_from_investing_activities
    type: number
    sql: net_cash_from_investing_activities
  - name: dividends_paid
    type: number
    sql: dividends_paid
  - name: debt_issued_or_repaid
    type: number
    sql: debt_issued_or_repaid
  - name: net_cash_from_financing_activities
    type: number
    sql: net_cash_from_financing_activities
  - name: net_change_in_cash
    type: number
    sql: net_change_in_cash
  - name: additional_metadata
    type: string
    sql: CAST(additional_metadata AS TEXT)
