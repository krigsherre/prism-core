    type: string
    sql: sys_document_id
  - name: employee_id
    type: string
    sql: employee_id
  - name: first_name
    type: string
    sql: first_name
  - name: last_name
    type: string
    sql: last_name
  - name: middle_name
    type: string
    sql: middle_name
  - name: date_of_birth
    type: time
    sql: date_of_birth
  - name: social_security_number
    type: string
    sql: social_security_number
  - name: national_id
    type: string
    sql: national_id
  - name: gender
    type: string
    sql: gender
  - name: marital_status
    type: string
    sql: marital_status
  - name: email_address
    type: string
    sql: email_address
  - name: phone_number
    type: string
    sql: phone_number
  - name: home_address
    type: string
    sql: home_address
  - name: hire_date
    type: time
    sql: hire_date
  - name: termination_date
    type: time
    sql: termination_date
  - name: department
    type: string
    sql: department
  - name: job_title
    type: string
    sql: job_title
  - name: manager_name
    type: string
    sql: manager_name
  - name: salary
    type: number
    sql: salary
  - name: bonus
    type: number
    sql: bonus
  - name: currency
    type: string
    sql: currency
  - name: employment_status
    type: string
    sql: employment_status
  - name: employment_type
    type: string
    sql: employment_type
  - name: additional_metadata
    type: string
    sql: CAST(additional_metadata AS TEXT)
