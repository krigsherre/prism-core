    type: count
  - name: total_total_invoice_value
    type: sum
    sql: total_invoice_value
  - name: avg_total_invoice_value
    type: avg
    sql: total_invoice_value
  - name: total_freight_charges
    type: sum
    sql: freight_charges
  - name: avg_freight_charges
    type: avg
    sql: freight_charges
  - name: total_insurance_charges
    type: sum
    sql: insurance_charges
  - name: avg_insurance_charges
    type: avg
    sql: insurance_charges
  - name: total_total_customs_value
    type: sum
    sql: total_customs_value
  - name: avg_total_customs_value
    type: avg
    sql: total_customs_value
  - name: total_customs_duties
    type: sum
    sql: customs_duties
  - name: avg_customs_duties
    type: avg
    sql: customs_duties
  - name: total_taxes
    type: sum
    sql: taxes
