syntax = "proto3";

package prism.v1;

option go_package = "contracts/gen/go/prism/v1;prismv1";

message IngestEvent {
  string event_id = 1;
  string tenant_id = 2;
  string s3_uri = 3;
  string file_hash_sha256 = 4;
  string timestamp = 5; // RFC3339
  map<string, string> metadata = 6;
}

message CitationPayload {
  string document_id = 1;
  int32 page = 2;
  repeated float normalized_coordinates = 3; // [x_min, y_min, x_max, y_max]
  string quoted_text = 4;
}
