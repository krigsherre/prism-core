[tool.poetry]
name = "agentic-brain"
version = "0.1.0"
description = "LangGraph Tri-Modal RAG orchestrator (SQL / Cypher / Vector)"
authors = ["Prism Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
langgraph = "^0.2.14"
langgraph-checkpoint-postgres = "^1.0.9"
langchain-core = "^0.2.37"
langchain-openai = "^0.1.23"
langchain-anthropic = "^0.1.23"
langchain-google-genai = "^1.0.8"
langchain-community = "^0.2.0"
qdrant-client = "^1.9.0"
sqlglot = "^25.1.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
asyncpg = "^0.29.0"
authlib = "^1.3.1"
psycopg = {extras = ["binary"], version = "^3.1.18"}
psycopg-pool = "^3.2.0"
neo4j = "^5.23.1"
boto3 = "^1.34.0"
python-multipart = "^0.0.9"
structlog = "^26.1.0"
httpx = "<0.28.0"
pandas = "<3.0.0"
redis = "^5.0.1"
opentelemetry-api = "^1.22.0"
opentelemetry-sdk = "^1.22.0"
aiokafka = "^0.10.0"
tenacity = ">=8.1.0,<9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
    ".",
    "src",
]
