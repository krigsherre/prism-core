[tool.poetry]
name = "storage-sync"
version = "0.1.0"
description = "Storage and CDC Worker"
authors = ["Prism Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
aiokafka = "^0.14.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.23"}
asyncpg = "^0.29.0"
qdrant-client = "~1.7.0"
alembic = "^1.12.1"
pydantic = "^2.4.2"
protobuf = ">=5.26.0"
structlog = "^24.1.0"
opentelemetry-api = "^1.20.0"
httpx = "<0.28.0"
greenlet = "^3.5.4"
tenacity = "^9.1.4"
pydantic-settings = "^2.14.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.5"
pytest-mock = "^3.12.0"
pytest-cov = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src",
  "../../packages/contracts/gen/python"
]
