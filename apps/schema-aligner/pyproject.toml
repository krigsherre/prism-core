[tool.poetry]
name = "schema-aligner"
version = "0.1.0"
description = "Schema alignment worker (LLM extract + critics + Reflexion)"
authors = ["Prism Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.104.1"
uvicorn = "^0.23.2"
aiokafka = "^0.10.0"
pydantic = "^2.4.2"
opentelemetry-api = "^1.20.0"
opentelemetry-sdk = "^1.20.0"
structlog = "^24.1.0"
openai = "^2.52.0"
grpcio-tools = "^1.83.0"
tenacity = "^9.1.4"
pydantic-settings = "^2.14.2"
instructor = "^1.15.4"
anthropic = "^0.120.2"
langchain-core = ">=0.2.0"
langchain-openai = ">=0.1.0"
langchain-anthropic = ">=0.1.0"
langchain-community = ">=0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.23.5"
pytest-mock = "^3.12.0"
httpx = "<0.28.0"
pytest-cov = "^4.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
  ".",
  "src",
  "../../packages/contracts/gen/python"
]
