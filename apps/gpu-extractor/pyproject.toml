[tool.poetry]
name = "gpu-extractor"
version = "0.1.0"
description = "GPU document extraction worker (Kafka → DocumentDOM)"
authors = ["Prism Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
fastapi = "^0.109.0"
uvicorn = "^0.23.2"
aiokafka = "^0.14.0"
pydantic = "^2.4.2"
protobuf = ">=5.26.0"
boto3 = "^1.34.0"
pillow = "^10.2.0"
pymupdf = "^1.24.2"
opentelemetry-api = "^1.20.0"
structlog = "^24.1.0"
prism-contracts = {path = "../../packages/contracts/gen/python", develop = true}
httpx = "^0.27.0"
pydantic-settings = "^2.14.2"
tenacity = "^9.1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
anyio = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
extraPaths = ["src", "../../packages/contracts/gen/python"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src",
  "../../packages/contracts/gen/python"
]
